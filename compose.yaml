volumes:
  postgres_data:

services:
  bot:
    build: .
    container_name: terra_script
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
